<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجيل الطلاب - جامعة البطانة</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #002b5b;
            --accent-color: #f4f7f6;
            --text-color: #333;
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f5;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* الهيدر الشعارات */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: #ffffff;
            border-bottom: 3px solid var(--primary-color);
        }

        .logo-box {
            text-align: center;
            width: 120px;
            height: 120px;
            border: 2px dashed #ccc;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #666;
            background-color: #f9f9f9;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 50%;
        }

        /* رسالة الترحيب */
        .welcome-banner {
            background-color: var(--accent-color);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .welcome-banner p {
            font-size: 16px;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .btn-start {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-start:hover {
            background-color: var(--secondary-color);
        }

        /* استمارة البيانات */
        .form-section {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--secondary-color);
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="email"],
        .form-group select,
        .form-group input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: var(--border-radius);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-color);
        }

        /* اختيار النوع (راديو) */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* زر الإرسال */
        .submit-btn-container {
            text-align: center;
            margin-top: 30px;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: var(--border-radius);
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        /* تجاوب مع الشاشات الصغيرة */
        @media (max-width: 600px) {
            .header {
                flex-direction: row;
                padding: 10px;
            }
            .logo-box {
                width: 80px;
                height: 80px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- الأعلى: الشعارات -->
    <header class="header">
        <!-- اليمين: شعار الجامعة -->
        <div class="logo-box">
            <img src="images/university_logo.png" alt="شعار جامعة البطانة" onerror="this.style.display='none'; this.parentNode.innerHTML='شعار جامعة البطانة';">
        </div>

        <h2 style="color: var(--secondary-color); text-align: center; font-size: 18px;">جامعة البطانة<br>إستمارة التسجيل الإلكتروني</h2>

        <!-- الشمال: شعار كلية علوم الحاسوب -->
        <div class="logo-box">
            <img src="images/cs_logo.png" alt="شعار كلية علوم الحاسوب" onerror="this.style.display='none'; this.parentNode.innerHTML='شعار كلية علوم الحاسوب';">
        </div>
    </header>

    <!-- الأسفل: رسالة الترحيب وزر الدخول -->
    <div class="welcome-banner">
        <p>عزيزي الطالب / الطالبة مرحباً بك في كلية علوم الحاسوب وتقانة المعلومات، الرجاء ملء البيانات التالية بدقة.</p>
        <button type="button" class="btn-start" onclick="document.getElementById('studentForm').scrollIntoView({behavior: 'smooth'});">الدخول لفورمة البيانات</button>
    </div>

    <!-- فورمة البيانات -->
    <section class="form-section">
        <form id="studentForm" action="#" method="POST" enctype="multipart/form-data">
            
            <!-- الاسم -->
            <div class="form-group">
                <label for="fullname">أدخل اسمك رباعياً:</label>
                <input type="text" id="fullname" name="fullname" placeholder="الاسم الكامل" required>
            </div>

            <!-- الرقم الجامعي -->
            <div class="form-group">
                <label for="student_id">الرقم الجامعي:</label>
                <input type="number" id="student_id" name="student_id" placeholder="مثال: 20230001" required>
            </div>

            <!-- رقم الهاتف -->
            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="text" id="phone" name="phone" placeholder="0912345678" required>
            </div>

            <!-- البريد الإلكتروني الشخصي -->
            <div class="form-group">
                <label for="email">الإيميل الخاص بك (الرقمي/الشخصي):</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- اختيار النوع -->
            <div class="form-group">
                <label>النوع (الجنس):</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="gender" value="ذكر" required> ذكر
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="gender" value="أنثى" required> أنثى
                    </label>
                </div>
            </div>

            <!-- قائمة اختيار الدفعة -->
            <div class="form-group">
                <label for="batch">اختر الدفعة:</label>
                <select id="batch" name="batch" required>
                    <option value="" disabled selected>-- اختر الدفعة --</option>
                    <option value="9">الدفعة ٩</option>
                    <option value="10">الدفعة ١٠</option>
                    <option value="11">الدفعة ١١</option>
                    <option value="12">الدفعة ١٢</option>
                    <option value="13">الدفعة ١٣</option>
                    <option value="14">الدفعة ١٤</option>
                </select>
            </div>

            <!-- قائمة اختيار الفصل الدراسي -->
            <div class="form-group">
                <label for="semester">اختر الفصل الدراسي:</label>
                <select id="semester" name="semester" required>
                    <option value="" disabled selected>-- اختر الفصل الدراسي --</option>
                    <option value="3">الفصل الثالث</option>
                    <option value="4">الفصل الرابع</option>
                    <option value="5">الفصل الخامس</option>
                    <option value="6">الفصل السادس</option>
                    <option value="7">الفصل السابع</option>
                    <option value="8">الفصل الثامن</option>
                    <option value="9">الفصل التاسع</option>
                    <option value="10">الفصل العاشر</option>
                </select>
            </div>

            <!-- ارفاق صورة إيصال السداد -->
            <div class="form-group">
                <label for="receipt">إرفاق صورة إيصال سداد الرسوم:</label>
                <input type="file" id="receipt" name="receipt" accept="image/*,.pdf" required>
            </div>

            <!-- إيميل الجامعة الرسمي لإرسال البيانات عليه -->
            <div class="form-group">
                <label for="official_email">إيميل الجامعة الرسمي (لإرسال البيانات إليه):</label>
                <input type="email" id="official_email" name="official_email" placeholder="registrar@elbatanah.edu.sd" required>
            </div>

            <!-- زر الإرسال -->
            <div class="submit-btn-container">
                <button type="submit" class="btn-submit">إرسال البيانات</button>
            </div>

        </form>
    </section>

</div>

</body>
</html>
